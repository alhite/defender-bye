[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defenderbye"
version = "0.1.0.dev0"
description = "Friendly GUI Defender Remover for Windows 10/11: remove or disable Microsoft Defender in one click, restore it anytime."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6"]

[project.gui-scripts]
defenderbye = "defenderbye.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/defenderbye/core"]
strict = true
